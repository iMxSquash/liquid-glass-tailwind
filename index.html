<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass — Tailwind v4 demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="h-dvh overflow-hidden font-sans">
    <div class="bg-demo fixed inset-0" aria-hidden="true">
      <span
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[12rem] font-extrabold tracking-tighter text-white/90 select-none"
        style="text-shadow: 0 2px 8px rgb(0 0 0 / 40%)"
        >GLASS</span
      >
    </div>

    <div
      id="square"
      data-liquid-glass
      class="liquid-glass fixed top-[200px] left-[200px] z-10 flex h-[220px] w-[220px] cursor-grab touch-none items-center justify-center text-sm font-semibold text-white/85 select-none active:cursor-grabbing"
      style="text-shadow: 0 1px 2px rgb(0 0 0 / 30%)"
    >
      glisse-moi
    </div>

    <div
      class="fixed top-4 right-4 z-20 w-60 rounded-2xl bg-neutral-900/80 p-4 text-xs text-neutral-100 backdrop-blur-md"
    >
      <h1 class="mb-3 text-sm font-semibold">Liquid glass — réglages</h1>

      <label class="mb-3 block">
        <div class="mb-1 flex justify-between opacity-75"><span>Distorsion (scale)</span><span id="scaleVal">48</span></div>
        <input id="scale" type="range" min="-100" max="100" value="48" step="2" class="w-full" />
      </label>

      <label class="mb-3 block">
        <div class="mb-1 flex justify-between opacity-75">
          <span>Aberration chromatique</span><span id="caVal">8</span>
        </div>
        <input id="ca" type="range" min="0" max="24" value="8" step="1" class="w-full" />
      </label>

      <label class="mb-3 block">
        <div class="mb-1 flex justify-between opacity-75"><span>Teinte</span><span id="tintVal">14%</span></div>
        <input id="tint" type="range" min="0" max="60" value="14" step="2" class="w-full" />
      </label>

      <label class="mb-3 block">
        <div class="mb-1 flex justify-between opacity-75"><span>Flou</span><span id="blurVal">3px</span></div>
        <input id="blur" type="range" min="0" max="24" value="3" step="1" class="w-full" />
      </label>

      <label class="mb-3 block">
        <div class="mb-1 flex justify-between opacity-75"><span>Lentille</span></div>
        <select id="lens" class="w-full rounded bg-neutral-800 px-2 py-1">
          <option value="diagonal" selected>diagonale (positif bas-droite / négatif haut-gauche)</option>
          <option value="symmetric">symétrique (quatre bords sortants)</option>
        </select>
      </label>

      <p class="mt-3 leading-relaxed opacity-60">
        Fais glisser le carré au-dessus du texte et de la grille pour voir la lentille déformer le fond. Effet
        construit avec l'utilitaire Tailwind v4 <code>liquid-glass</code> du skill + le module de réfraction en
        <code>src/refraction.js</code>.
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
